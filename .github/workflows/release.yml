name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            sidecar: npm run sidecar:install
            dist: npm run dist:mac
            artifact: mac
          - os: windows-latest
            sidecar: npm run sidecar:install:win
            dist: npm run dist:win
            artifact: win
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: npm ci
      - run: ${{ matrix.sidecar }}
      - run: npm run build
      - name: Build installers (macOS)
        if: matrix.artifact == 'mac'
        env:
          MACOS_CERTIFICATE_BASE64: ${{ secrets.MACOS_CERTIFICATE_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_NOTARIZE_EMAIL: ${{ secrets.APPLE_NOTARIZE_EMAIL }}
          APPLE_NOTARIZE_APP_PASSWORD: ${{ secrets.APPLE_NOTARIZE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -n "$MACOS_CERTIFICATE_BASE64" ]; then
            export CSC_LINK="$MACOS_CERTIFICATE_BASE64"
            export CSC_KEY_PASSWORD="$MACOS_CERTIFICATE_PASSWORD"
            export APPLE_ID="$APPLE_NOTARIZE_EMAIL"
            export APPLE_APP_SPECIFIC_PASSWORD="$APPLE_NOTARIZE_APP_PASSWORD"
            export APPLE_TEAM_ID="$APPLE_TEAM_ID"
          fi
          npm run dist:mac
      - name: Build installers (Windows)
        if: matrix.artifact == 'win'
        env:
          WINDOWS_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          if [ -n "$WINDOWS_CERTIFICATE_BASE64" ]; then
            export CSC_LINK="$WINDOWS_CERTIFICATE_BASE64"
            export CSC_KEY_PASSWORD="$WINDOWS_CERTIFICATE_PASSWORD"
          fi
          npm run dist:win
      - name: Bundle unsigned install guides
        if: matrix.artifact == 'mac'
        run: |
          cp resources/install/INSTALL-macOS.txt release/ 2>/dev/null || true
          cp resources/install/INSTALL-Windows.txt release/ 2>/dev/null || true
      - name: Bundle unsigned install guides (Windows job)
        if: matrix.artifact == 'win'
        run: |
          cp resources/install/INSTALL-Windows.txt release/ 2>/dev/null || true
          cp resources/install/INSTALL-macOS.txt release/ 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.artifact }}
          path: |
            release/*.dmg
            release/*.exe
            release/*.zip
            release/*.txt
            release/*.yml
            release/*.blockmap
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist-artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist-artifacts/**
          generate_release_notes: true
