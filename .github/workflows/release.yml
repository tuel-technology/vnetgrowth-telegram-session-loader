name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            sidecar: npm run sidecar:install
            dist: npm run dist:mac
            artifact: mac
          - os: windows-latest
            sidecar: npm run sidecar:install:win
            dist: npm run dist:win
            artifact: win
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: npm ci
      - run: ${{ matrix.sidecar }}
      - run: npm run build
      - run: ${{ matrix.dist }}
      - uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.artifact }}
          path: release/**
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist-artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist-artifacts/**
          generate_release_notes: true
