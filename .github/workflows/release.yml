name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: npm ci
      - run: npm run sidecar:install
      - run: npm run build
      - name: Build macOS installers
        env:
          MACOS_CERTIFICATE_BASE64: ${{ secrets.MACOS_CERTIFICATE_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_NOTARIZE_EMAIL: ${{ secrets.APPLE_NOTARIZE_EMAIL }}
          APPLE_NOTARIZE_APP_PASSWORD: ${{ secrets.APPLE_NOTARIZE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -n "$MACOS_CERTIFICATE_BASE64" ]; then
            export CSC_LINK="$MACOS_CERTIFICATE_BASE64"
            export CSC_KEY_PASSWORD="$MACOS_CERTIFICATE_PASSWORD"
            export APPLE_ID="$APPLE_NOTARIZE_EMAIL"
            export APPLE_APP_SPECIFIC_PASSWORD="$APPLE_NOTARIZE_APP_PASSWORD"
            export APPLE_TEAM_ID="$APPLE_TEAM_ID"
          fi
          npm run dist:mac
      - name: Bundle install guides
        run: |
          cp resources/install/INSTALL-macOS.txt release/ 2>/dev/null || true
          cp resources/install/INSTALL-Windows.txt release/ 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        with:
          name: installer-mac
          path: |
            release/*.dmg
            release/*.zip
            release/*.txt
            release/*.yml
            release/*.blockmap
          if-no-files-found: error

  build-win:
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install npm dependencies
        shell: pwsh
        run: |
          npm ci
          if ($LASTEXITCODE -ne 0) {
            Write-Host "npm ci failed; retrying once..."
            npm ci
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - run: npm run sidecar:install:win
      - run: npm run build
      - name: Build Windows installers
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          if ($env:WINDOWS_CERTIFICATE_BASE64) {
            $env:CSC_LINK = $env:WINDOWS_CERTIFICATE_BASE64
            $env:CSC_KEY_PASSWORD = $env:WINDOWS_CERTIFICATE_PASSWORD
          }
          npm run dist:win
      - name: Bundle install guides
        shell: pwsh
        run: |
          Copy-Item resources/install/INSTALL-Windows.txt release/ -ErrorAction SilentlyContinue
          Copy-Item resources/install/INSTALL-macOS.txt release/ -ErrorAction SilentlyContinue
      - uses: actions/upload-artifact@v4
        with:
          name: installer-win
          path: |
            release/*.exe
            release/*.txt
            release/*.yml
            release/*.blockmap
          if-no-files-found: error

  publish:
    needs: [build-mac, build-win]
    if: needs.build-mac.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist-artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist-artifacts/**
          generate_release_notes: true
